server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  # Base de datos propia del microservicio (Database per Service), persistente en ./data
  datasource:
    url: jdbc:h2:file:./data/userdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
