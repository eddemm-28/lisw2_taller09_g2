server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: lifecycle-service
  # Base de datos propia del microservicio (Database per Service), persistente en ./data
  datasource:
    url: jdbc:h2:file:./data/lifecycledb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        # Tras 3 intentos fallidos el mensaje se envia a la cola de mensajes muertos (DLQ)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0

lifecycle:
  # Retardo artificial para evidenciar en Postman que 202 Accepted llega antes que el resultado
  simulated-processing-delay-ms: ${LIFECYCLE_PROCESSING_DELAY_MS:2000}
