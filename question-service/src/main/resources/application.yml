server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: question-service
  # Base de datos propia del microservicio (Database per Service), persistente en ./data
  datasource:
    url: jdbc:h2:file:./data/questiondb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # Mensajes sin cola destino vuelven al publicador (la operacion se marca FAILED)
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0

# URLs de los microservicios invocados de forma sincrona
services:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  validation:
    url: ${VALIDATION_SERVICE_URL:http://localhost:8082}
  lifecycle:
    url: ${LIFECYCLE_SERVICE_URL:http://localhost:8084}
  http:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
