server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: review-service
  # Base de datos propia del microservicio (Database per Service), persistente en ./data
  datasource:
    url: jdbc:h2:file:./data/reviewdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

# URLs de los microservicios invocados de forma sincrona
services:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  lifecycle:
    url: ${LIFECYCLE_SERVICE_URL:http://localhost:8084}
  http:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
