# Infraestructura de mensajeria del Taller 09 - Banco de Preguntas Saber PRO
#   AMQP:            localhost:5672   (usado por los microservicios)
#   Administracion:  http://localhost:15672  (usuario guest / clave guest)
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: saberpro-rabbitmq
    ports:
      - "5672:5672"    # Puerto AMQP para microservicios
      - "15672:15672"  # Consola web de administracion (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq-data:
